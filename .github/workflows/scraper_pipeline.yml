name: Saudi Career Data Scraping Pipeline

on:
  schedule:
    # يعمل تلقائياً يومياً الساعة 03:37 فجراً بتوقيت السعودية (00:00 UTC)
    - cron: '37 0 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً بضغطة زر للتجربة

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy pandas numpy

      - name: Run Data Collection Pipeline
        run: |
          # تشغيل السكربت لجلب الوظائف الحقيقية وتحديث الداتاسيت الموحدة
          python saudi_real_scraper_pipeline.py --limit 60

      - name: Commit and Push Updated Dataset
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # إضافة ملفات الداتاسيت المحدثة
          git add saudi_career_master_dataset.csv saudi_career_system.db || true
          
          # فحص ما إذا كانت هناك بيانات جديدة قبل عمل الـ Commit
          if git diff --staged --quiet; then
            echo "لا توجد بيانات جديدة مضافة في هذه الجولة."
          else
            git commit -m "Auto-update: Saudi tech career dataset [skip ci]"
            git push
          fi
